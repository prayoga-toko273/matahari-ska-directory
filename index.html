<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Area Directory Matahari SKA Pekanbaru</title>
<style>
:root{--ink:#292524;--mut:#78716c;--line:#e7e2db;--bg:#f5f3f0;--red:#d3202f;--blue:#d3202f;--green:#15803d;--card:#fff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg)}
#app{display:flex;flex-direction:column;height:100dvh;max-width:1100px;margin:0 auto;background:var(--bg)}
header{background:var(--ink);border-bottom:4px solid #d3202f;color:#fff;padding:10px 14px;display:flex;align-items:center;gap:10px;flex:none}
header h1{font-size:15px;margin:0;font-weight:700;letter-spacing:.2px;line-height:1.2}
header small{display:block;font-weight:400;opacity:.75;font-size:11px}
.here{margin-left:auto;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:999px;padding:6px 10px;font-size:12px;cursor:pointer;white-space:nowrap}
.here b{color:#fff}
main{flex:1;min-height:0;display:flex;flex-direction:column}
@media(min-width:820px){main{flex-direction:row}#mapwrap{flex:1.5}#panel{flex:1;max-width:420px}}
#mapwrap{position:relative;flex:0 0 46%;min-height:0;background:#f5f3f0;border-bottom:1px solid var(--line);overflow:hidden}
@media(min-width:820px){#mapwrap{flex:1.5;border-bottom:0;border-right:1px solid var(--line)}}
svg#map{width:100%;height:100%;display:block;touch-action:none;cursor:grab;user-select:none}
.floors{position:absolute;left:8px;top:8px;display:flex;gap:4px;z-index:2}
.floors button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 10px;font-size:12px;font-weight:600;color:var(--ink);cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.floors button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.zoom{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:4px;z-index:2}
.zoom button{width:32px;height:32px;border:1px solid var(--line);background:#fff;border-radius:8px;font-size:18px;line-height:1;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.legend{position:absolute;left:8px;bottom:8px;background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:8px;padding:5px 8px;font-size:11px;color:var(--mut);z-index:2;display:flex;gap:10px;align-items:center}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:-1px}
#panel{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--bg)}
.search{padding:10px 12px 6px;flex:none}
.search input{width:100%;padding:11px 14px;border-radius:12px;border:1px solid #cdd4e0;font-size:16px;outline:none;background:#fff}
.search input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(211,32,47,.15)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:4px 12px 8px;flex:none;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid #cdd4e0;background:#fff;border-radius:999px;padding:5px 11px;font-size:12px;cursor:pointer;color:var(--ink);white-space:nowrap}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.list{flex:1;overflow:auto;padding:0 12px 14px}
.item{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:7px;display:flex;align-items:center;gap:10px;cursor:pointer}
.item:active{background:#fdecee}
.item .n{font-weight:600;font-size:14px}
.item .s{font-size:12px;color:var(--mut);margin-top:1px}
.badge{margin-left:auto;flex:none;font-size:11px;font-weight:700;border-radius:6px;padding:3px 7px;background:#efebe6;color:#44403c}
.badge.f2{background:#fdecee;color:#d3202f}
.empty{text-align:center;color:var(--mut);font-size:13px;padding:26px 10px}
.route{padding:12px 14px;overflow:auto;flex:1}
.route .top{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.back{border:1px solid #cdd4e0;background:#fff;border-radius:10px;padding:7px 11px;font-size:13px;cursor:pointer}
.route h2{margin:0;font-size:17px}
.route .sub{font-size:12px;color:var(--mut)}
.steps{list-style:none;margin:12px 0;padding:0;counter-reset:s}
.steps li{position:relative;padding:8px 0 8px 36px;font-size:14px;line-height:1.35;border-bottom:1px dashed var(--line)}
.steps li:last-child{border-bottom:0}
.steps li:before{counter-increment:s;content:counter(s);position:absolute;left:0;top:7px;width:24px;height:24px;border-radius:50%;background:var(--blue);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
.note{font-size:12px;color:#8a5a00;background:#fff7e0;border:1px solid #f5dc9b;border-radius:10px;padding:8px 10px;margin-top:6px}
.sheet{position:fixed;inset:0;background:rgba(10,18,40,.5);display:none;align-items:flex-end;justify-content:center;z-index:20}
.sheet.show{display:flex}
.sheet .box{background:#fff;width:100%;max-width:520px;border-radius:18px 18px 0 0;padding:16px;max-height:80vh;overflow:auto}
.sheet h3{margin:0 0 4px;font-size:16px}
.sheet p{margin:0 0 12px;font-size:12px;color:var(--mut)}
.opt{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:12px;padding:11px 12px;margin-bottom:7px;font-size:14px;cursor:pointer}
.opt.on{border-color:#d3202f;background:#fdecee}
.opt small{display:block;color:var(--mut);font-size:11px}
@keyframes dash{to{stroke-dashoffset:-40}}
.routeline{animation:dash 1.2s linear infinite}
@media(max-width:599px){.legend{display:none}}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px 12px 8px;flex:none}
.mode{display:flex;align-items:center;justify-content:center;gap:8px;padding:13px 10px;border-radius:14px;border:1.5px solid #d6d3d1;background:#fff;font-size:15px;font-weight:700;color:var(--ink);cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.06);font-family:inherit}
.mode svg{width:18px;height:18px;flex:none}
.mode .chev{font-size:11px;transition:transform .2s}
.mode.on{background:#d3202f;border-color:#d3202f;color:#fff;box-shadow:0 4px 12px rgba(211,32,47,.28)}
.mode.on .chev{transform:rotate(180deg)}
.dd{display:flex;flex-direction:column;min-height:0;flex:1;margin:0 12px 10px;background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 6px 18px rgba(41,37,36,.08)}
.dd[hidden]{display:none}
.dd .search{padding:10px 10px 6px}
.dd .list{padding:0 10px 10px}
.dd .item{border-radius:10px;margin-bottom:6px}
.letter{position:sticky;top:0;background:#fff;font-size:12px;font-weight:800;color:#d3202f;padding:8px 2px 4px;letter-spacing:1px;z-index:1}
.cnum{flex:none;width:30px;height:30px;border-radius:50%;background:#fdecee;color:#d3202f;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center}
.hint{color:var(--mut);font-size:13px;text-align:center;padding:18px 16px;line-height:1.5}
.blist{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.blist button{border:1px solid #d6d3d1;background:#fff;border-radius:999px;padding:6px 11px;font-size:12px;cursor:pointer;font-family:inherit;color:var(--ink)}
@keyframes run{to{stroke-dashoffset:-32}}
@keyframes pulse{0%,100%{opacity:.45}50%{opacity:.08}}
.lights{animation:run .7s linear infinite}
.glow{animation:pulse 1.3s ease-in-out infinite}
</style>
</head>

 <ol class="steps">${steps.map(x=>`<li>${x}</li>`).join('')}</ol>
 ${state.route.cross?`<button class="back" id="nf" style="margin-top:6px;background:#d3202f;color:#fff;border-color:#d3202f;width:100%;padding:11px">Setelah di eskalator: lihat area di Lantai ${C.f} &rarr;</button>`:''}
 ${bs.length?`<div class="sub" style="margin-top:14px;font-weight:700;color:var(--ink)">Brand di area ini (${bs.length}) — ketuk untuk rute ke counter:</div>
 <div class="blist">${bs.map((b,i)=>`<button data-i="${BR.indexOf(b)}">${title(bname(b))}</button>`).join('')}</div>`:''}`;
 $('#bk').onclick=back;
 if($('#nf'))$('#nf').onclick=()=>{setFloor(C.f);fitRoute(C.f)};
 R.querySelectorAll('.blist button').forEach(x=>x.onclick=()=>pick(BR[+x.dataset.i]));
}
function fitRoute(f){
 const pts=[];for(const seg of state.route.segs)if(seg.f===f)pts.push(...seg.pts);
 for(const m of state.route.marks)if(m.f===f)pts.push([m.x,m.y]);
 if(state.cat&&state.cat.f===f)for(const r of state.cat.rects){pts.push([r.x,r.y]);pts.push([r.x+r.w,r.y+r.h])}
 const xs=pts.map(p=>p[0]),ys=pts.map(p=>p[1]);
 fit({x:Math.min(...xs),y:Math.min(...ys),w:Math.max(...xs)-Math.min(...xs)||80,h:Math.max(...ys)-Math.min(...ys)||80},90);
}
function showRoute(b,s){
 $('#browse').style.display='none';const R=$('#route');R.style.display='block';
 const steps=[];
 steps.push(`Mulai dari <b>${s.name}, ${s.sub}</b> (titik hitam di peta).`);
 if(state.route.cross){
  steps.push(`Ikuti garis merah menuju <b>eskalator</b> di tengah toko (tanda abu-abu), lalu ${b.f>s.f?'naik':'turun'} ke <b>Lantai ${b.f}</b>.`);
  steps.push(`Di Lantai ${b.f}, lanjutkan mengikuti garis merah ke area <b>${title(b.w)}</b>.`);
 }else{
  steps.push(`Ikuti garis merah menuju area <b>${title(b.w)}</b>.`);
 }
 steps.push(b.t>=0?`<b>${title(bname(b))}</b> ada di counter berwarna merah pada peta.`:`<b>${title(bname(b))}</b> ada di sekitar lingkaran merah putus-putus (area ${title(b.w)}). Lihat papan nama di counter.`);
 R.innerHTML=`<div class="top"><button class="back" id="bk">&larr; Cari lagi</button></div>
 <h2>${title(bname(b))}</h2><div class="sub">${title(b.w)} · Lantai ${b.f}${state.route.cross?' · beda lantai dari posisi Anda':''}</div>
 <ol class="steps">${steps.map(x=>`<li>${x}</li>`).join('')}</ol>
 ${state.route.cross?`<button class="back" id="nf" style="margin-top:6px;background:#d3202f;color:#fff;border-color:#d3202f;width:100%;padding:11px">Setelah di eskalator: lihat rute Lantai ${b.f} &rarr;</button><div class="note">Anda juga bisa pindah lantai lewat tombol <b>Lantai 1 / Lantai 2</b> di peta.</div>`:''}`;
 $('#bk').onclick=back;
 if($('#nf'))$('#nf').onclick=()=>{setFloor(b.f);fitRoute(b.f)};
}
function back(){state.route=null;state.sel=null;state.cat=null;$('#route').style.display='none';$('#browse').style.display='flex';draw();resetView()}
/* posisi awal */
function openSheet(){
 const o=$('#opts');o.innerHTML='';
 for(const k in STARTS){const s=STARTS[k];const b=document.createElement('button');b.className='opt'+(k===state.start?' on':'');b.innerHTML=`<span style="font-size:20px">📍</span><span><b>${s.name}</b><small>${s.sub}</small></span>`;b.onclick=()=>{setStart(k);$('#sheet').classList.remove('show')};o.appendChild(b)}
 $('#sheet').classList.add('show');
}
function setStart(k){
 if(!STARTS[k])return;state.start=k;try{history.replaceState(null,'','#'+k)}catch(e){try{location.hash=k}catch(_){}}
 hereLabel();state.floor=STARTS[k].f;
 if(state.cat){const c=CATS.find(c=>c[0]===state.cat.name);pickCat(c)}else if(state.sel)pick(state.sel);else{draw();resetView()}
}
$('#hereBtn').onclick=openSheet;
$('#sheet').onclick=e=>{if(e.target.id==='sheet')$('#sheet').classList.remove('show')};
document.querySelectorAll('.floors button').forEach(b=>b.onclick=()=>{setFloor(+b.dataset.f);if(state.route)fitRoute(+b.dataset.f);else resetView()});
$('#q').addEventListener('input',e=>{state.q=e.target.value;renderList()});
window.addEventListener('hashchange',()=>{const k=location.hash.slice(1);if(STARTS[k]&&k!==state.start)setStart(k)});
/* pan & zoom */
const svg=$('#map');const ptr=new Map();let last=null;
function zoomAt(f,cx,cy){const r=svg.getBoundingClientRect();const mx=vb.x+(cx-r.left)/r.width*vb.w,my=vb.y+(cy-r.top)/r.height*vb.h;
 const nw=Math.max(260,Math.min(1500,vb.w*f));const k=nw/vb.w;vb.x=mx-(mx-vb.x)*k;vb.y=my-(my-vb.y)*k;vb.w=nw;vb.h*=k;setVB()}
svg.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.deltaY>0?1.15:0.87,e.clientX,e.clientY)},{passive:false});
svg.addEventListener('pointerdown',e=>{svg.setPointerCapture(e.pointerId);ptr.set(e.pointerId,[e.clientX,e.clientY]);last=null});
svg.addEventListener('pointermove',e=>{
 if(!ptr.has(e.pointerId))return;const r=svg.getBoundingClientRect();
 const old=ptr.get(e.pointerId);ptr.set(e.pointerId,[e.clientX,e.clientY]);
 if(ptr.size===1){vb.x-=(e.clientX-old[0])/r.width*vb.w;vb.y-=(e.clientY-old[1])/r.height*vb.h;setVB()}
 else if(ptr.size===2){const p=[...ptr.values()];const d=Math.hypot(p[0][0]-p[1][0],p[0][1]-p[1][1]);if(last)zoomAt(last/d,(p[0][0]+p[1][0])/2,(p[0][1]+p[1][1])/2);last=d}
});
const up=e=>{ptr.delete(e.pointerId);last=null};svg.addEventListener('pointerup',up);svg.addEventListener('pointercancel',up);
$('#zin').onclick=()=>{const r=svg.getBoundingClientRect();zoomAt(0.75,r.left+r.width/2,r.top+r.height/2)};
$('#zout').onclick=()=>{const r=svg.getBoundingClientRect();zoomAt(1.33,r.left+r.width/2,r.top+r.height/2)};
$('#zreset').onclick=()=>{if(state.route)fitRoute(state.floor);else resetView()};
window.addEventListener('resize',()=>{if(state.route)fitRoute(state.floor);else resetView()});
/* mulai */
(function init(){
 const k=location.hash.slice(1);if(STARTS[k]){state.start=k;state.floor=STARTS[k].f}
 hereLabel();renderList();renderCats();$('#mB').onclick=()=>setMode('B');$('#mK').onclick=()=>setMode('K');draw();resetView();
})();
</script>
</body>
</html>
